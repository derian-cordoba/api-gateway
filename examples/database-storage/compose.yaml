services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: gateway_dev
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway_dev"]
      interval: 5s
      timeout: 3s
      retries: 15
  mongodb:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    ports:
      - "127.0.0.1:27018:27018"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --port 27018 --eval
          'try { rs.status(); } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27018"}]}); }'
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
  mongodb-data:
